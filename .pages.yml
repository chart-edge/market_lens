media:
  input: media
  output: media
  categories: [image]
content:
  - name: posts
    label: Market analyses
    type: file
    path: content/posts.json
    format: json
    list: true
    fields:
      - name: title
        label: Article title
        type: string
        required: true
      - name: slug
        label: URL name (lowercase, use hyphens)
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
      - name: category
        label: Category
        type: select
        options:
          values:
            - label: Technical analysis
              name: technical
            - label: Risk management
              name: risk
            - label: Trading journal
              name: journal
        required: true
      - name: excerpt
        label: Short summary
        type: text
        required: true
      - name: chart_image
        label: Chart screenshot (optional)
        type: image
      - name: body
        label: Analysis content
        type: text
        required: true
      - name: published
        label: Show on public website
        type: boolean
settings:
  content:
    merge: true
